[package]
name = "lean_tee_prove_server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "lean_tee.v1.Prove gRPC server (mock and optional SP1)"

[[bin]]
name = "prove_server"
path = "src/main.rs"

[[bin]]
name = "sp1_smoke"
path = "src/bin/sp1_smoke.rs"
required-features = ["sp1"]

[[bin]]
name = "sp1_lean_spike_smoke"
path = "src/bin/sp1_lean_spike_smoke.rs"
required-features = ["sp1"]

[[bin]]
name = "sp1_lean_mid_smoke"
path = "src/bin/sp1_lean_mid_smoke.rs"
required-features = ["sp1"]

[[bin]]
name = "sp1_lean_guest_smoke"
path = "src/bin/sp1_lean_guest_smoke.rs"
required-features = ["sp1"]

[[bin]]
name = "sp1_lean_guestprog_smoke"
path = "src/bin/sp1_lean_guestprog_smoke.rs"
required-features = ["sp1"]

[features]
default = []
# Enable with `--features sp1` (needs cargo prove / sp1up).
sp1 = ["dep:sp1-sdk", "dep:sp1-build", "dep:bincode", "dep:serde"]

[dependencies]
lean_tee_compliance = { path = "../compliance_lib" }
lean_tee_receipt = { path = "../receipt" }
bytes = "1"
hex = "0.4"
prost = "0.13"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tonic = { version = "0.12", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }
sp1-sdk = { version = "6.3.1", default-features = false, features = ["blocking"], optional = true }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"
sp1-build = { version = "6.3.1", optional = true }
