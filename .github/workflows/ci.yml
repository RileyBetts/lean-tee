name: ci

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  lean-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config
      # lean-action looked for lean-toolchain at workspace root while checkout used
      # path: lean-tee (leftover sibling layout). Install elan against repo root instead.
      - name: Install Lean 4.32.1 (elan)
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - name: Build + demos
        run: |
          set -euo pipefail
          lake update
          lake build receiptTests teeServer teeClient teeLoopback goldenVectors adversarialMatrix guestRegistry rustProveLoopback
          ./.lake/build/bin/receiptTests
          ./.lake/build/bin/goldenVectors
          ./.lake/build/bin/guestRegistry
          ./.lake/build/bin/teeLoopback
          pip install pytest -q
          PYTHONPATH="$PWD/clients/python" pytest clients/python/tests -q
          bash scripts/standalone_demo.sh
          bash scripts/adversarial_matrix_demo.sh
          bash scripts/action_matrix_demo.sh
          bash scripts/enterprise_control_demo.sh
          bash scripts/cross_impl_golden_demo.sh
          bash scripts/guest_prog_demo.sh
          bash scripts/confidentiality_local_demo.sh
          bash scripts/prove_mock_loopback_demo.sh

  rust-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test receipt + compliance
        working-directory: host
        run: cargo test -p lean_tee_receipt -p lean_tee_compliance
      - name: Build mock prove_server
        working-directory: host
        run: cargo build -p lean_tee_prove_server
      - name: Build Rust client
        run: cargo build --manifest-path clients/rust/Cargo.toml
