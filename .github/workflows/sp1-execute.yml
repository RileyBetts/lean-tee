name: sp1-execute

# Gated SP1 path: weekly + manual. Default = execute-only on Lean guest ELF.
# Optional mock prove-one (workflow_dispatch).
# Real CPU prove only when prove_one + prove_heavy (OOM risk on ubuntu-latest).

on:
  schedule:
    - cron: "17 6 * * 1" # weekly Monday 06:17 UTC
  workflow_dispatch:
    inputs:
      prove_one:
        description: "Also run one prove (mock unless prove_heavy)"
        type: boolean
        default: true
      prove_heavy:
        description: "Real CPU prove+verify of Lean ELF (needs prove_one; aborts if <10GiB free unless runner is large)"
        type: boolean
        default: false

jobs:
  sp1-execute-only:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Lean 4.32.1 (elan)
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - name: Install SP1 toolchain (+ C)
        run: |
          set -euo pipefail
          curl -L https://sp1up.succinct.xyz | bash
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
          echo "$HOME/.sp1/riscv/bin" >> "$GITHUB_PATH"
          "$HOME/.sp1/bin/sp1up"
          "$HOME/.sp1/bin/sp1up" --c-toolchain
          test -x "$HOME/.sp1/riscv/bin/riscv64-unknown-elf-gcc"
          "$HOME/.sp1/riscv/bin/riscv64-unknown-elf-gcc" --version | head -1
      - name: SP1 Lean guest smoke
        env:
          # Schedule: execute-only. Manual: prove_one default true → mock prove case 0.
          SP1_PROVE_ONE: ${{ github.event_name == 'workflow_dispatch' && inputs.prove_one && '1' || '0' }}
          # Heavy only on explicit workflow_dispatch prove_heavy (+ prove_one). Never on schedule.
          SP1_PROVE_HEAVY: ${{ github.event_name == 'workflow_dispatch' && inputs.prove_one && inputs.prove_heavy && '1' || '0' }}
          CARGO_TERM_COLOR: always
        run: bash scripts/sp1_execute_ci.sh
      - name: Upload guest digests
        uses: actions/upload-artifact@v4
        with:
          name: sp1-guest-digests
          path: artifacts/sp1_guest_digests.json
          if-no-files-found: error
