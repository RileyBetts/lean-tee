name: sp1-execute

# SP1 Lean guest smoke + digest pin. Manual only for now — GitHub-hosted
# runners do not have enough RAM/CPU for reliable execute/prove. Run locally
# (or on a suitably sized self-hosted runner) via:
#   bash scripts/sp1_execute_ci.sh
#   gh workflow run sp1-execute.yml -f prove_one=false -f prove_heavy=false
# Re-enable pull_request / push / schedule when adequate compute is available.

on:
  workflow_dispatch:
    inputs:
      prove_one:
        description: "Also run one prove (mock unless prove_heavy)"
        type: boolean
        default: false
      prove_heavy:
        description: "Real CPU prove+verify of Lean ELF (needs prove_one; uses larger runner job)"
        type: boolean
        default: false

jobs:
  sp1-execute:
    if: ${{ !inputs.prove_heavy }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          path: lean-tee
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config
      - name: Install Lean 4.32.1 (elan)
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version
      - name: Install SP1 toolchain (+ C)
        run: |
          set -euo pipefail
          curl -L https://sp1up.succinct.xyz | bash
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
          echo "$HOME/.sp1/riscv/bin" >> "$GITHUB_PATH"
          "$HOME/.sp1/bin/sp1up"
          "$HOME/.sp1/bin/sp1up" --c-toolchain
          test -x "$HOME/.sp1/riscv/bin/riscv64-unknown-elf-gcc"
          "$HOME/.sp1/riscv/bin/riscv64-unknown-elf-gcc" --version | head -1
      - name: SP1 Lean guest smoke (execute + digest pin)
        working-directory: lean-tee
        env:
          SP1_PROVE_ONE: ${{ inputs.prove_one && '1' || '0' }}
          SP1_PROVE_HEAVY: "0"
          SP1_CHECK_DIGESTS: "1"
          CARGO_TERM_COLOR: always
        run: bash scripts/sp1_execute_ci.sh
      - name: Upload guest digests
        uses: actions/upload-artifact@v7
        with:
          name: sp1-guest-digests
          path: lean-tee/artifacts/sp1_guest_digests.json
          if-no-files-found: error

  sp1-prove-heavy:
    # Needs a larger runner (≈32 GiB). Skip unless org has ubuntu-latest-8-cores
    # (or equivalent) enabled — otherwise this job queues forever / OOMs.
    runs-on: ubuntu-latest-8-cores
    if: ${{ inputs.prove_one && inputs.prove_heavy }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          path: lean-tee
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config
      - name: Install Lean 4.32.1 (elan)
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.32.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install SP1 toolchain (+ C)
        run: |
          set -euo pipefail
          curl -L https://sp1up.succinct.xyz | bash
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"
          echo "$HOME/.sp1/riscv/bin" >> "$GITHUB_PATH"
          "$HOME/.sp1/bin/sp1up"
          "$HOME/.sp1/bin/sp1up" --c-toolchain
      - name: SP1 real CPU prove+verify (case 0)
        working-directory: lean-tee
        env:
          SP1_PROVE_ONE: "1"
          SP1_PROVE_HEAVY: "1"
          SP1_CHECK_DIGESTS: "1"
          CARGO_TERM_COLOR: always
        run: bash scripts/sp1_execute_ci.sh
      - name: Upload guest digests (post-prove)
        uses: actions/upload-artifact@v7
        with:
          name: sp1-guest-digests-heavy
          path: lean-tee/artifacts/sp1_guest_digests.json
          if-no-files-found: error
