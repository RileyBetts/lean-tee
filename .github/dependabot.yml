version: 2
updates:
  - package-ecosystem: cargo
    directory: /host
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /clients/rust
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
